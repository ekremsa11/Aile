<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zeynep Arıyor</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle at 50% 20%, #fffafd, #ffe3f1 58%, #f9c9e2);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100dvh; color: #5c3155; text-align: center; overflow: hidden;
        }
        
        .container {
            background: white; padding: 20px; border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 400px;
            display: flex; flex-direction: column; align-items: center;
            border: 4px solid #ffcce5; z-index: 10;
        }

        .photo-frame {
            width: 180px; height: 180px; border-radius: 50%; overflow: hidden;
            border: 5px solid #ff83bf; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .photo-frame img { width: 100%; height: 100%; object-fit: cover; }

        .btn {
            width: 100%; padding: 20px; font-size: 24px; font-weight: 900; border: none;
            border-radius: 25px; cursor: pointer; transition: all 0.1s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn:active { transform: scale(0.95); }

        .btn-call {
            background: #4ade80; color: white; box-shadow: 0 8px 0 #22c55e; margin-bottom: 10px;
        }
        
        /* Gelen Arama Butonları */
        .answer-buttons {
            display: none; width: 100%; gap: 10px; justify-content: center;
            animation: pulse 1.5s infinite; margin-bottom: 10px;
        }
        
        .btn-answer { background: #22c55e; color: white; box-shadow: 0 8px 0 #16a34a; flex: 1; font-size: 20px;}
        .btn-reject { background: #ef4444; color: white; box-shadow: 0 8px 0 #b91c1c; flex: 1; font-size: 20px;}
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* Görüntülü Görüşme Ekranı */
        #video-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 1000; flex-direction: column;
        }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        #local-video {
            position: absolute; bottom: 100px; right: 20px; width: 100px; height: 150px;
            object-fit: cover; border-radius: 15px; border: 3px solid white; z-index: 1001;
        }
        .end-call-btn {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #ef4444; color: white; border: none; width: 70px; height: 70px;
            border-radius: 50%; font-size: 30px; cursor: pointer; z-index: 1002;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="container" id="main-menu">
        
        <div class="photo-frame">
            <img src="20260616_141549.jpg" alt="Babam">
        </div>
        
        <!-- Herkes Arayabilir -->
        <button class="btn btn-call" id="call-btn" onclick="startCall()">📞 ARA</button>
        
        <!-- Gelen Arama Butonları (Sadece arama gelince çıkar) -->
        <div class="answer-buttons" id="answer-buttons">
            <button class="btn btn-reject" onclick="rejectCall()">❌ REDDET</button>
            <button class="btn btn-answer" onclick="answerCall()">📞 AÇ</button>
        </div>
        
        <p id="status-text" style="margin-top: 10px; font-weight: bold; color: #a3427d; font-size: 14px;">Hazır</p>
        
        <!-- SES İZNİ BUTONU -->
        <button id="enable-sound-btn" onclick="enableSound()" style="display: none; margin-top: 10px; padding: 10px 20px; background: #7250a8; color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: bold;">
            🔔 Sesi ve Titreşimi Aç (İlk açılışta bas)
        </button>
    </div>

    <!-- Görüntülü Konuşma Ekranı -->
    <div id="video-screen">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
        <button class="end-call-btn" onclick="endCall()">❌</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBJttoH3cuIWpXVtng8-wDDvRK-4fUfdeg",
            authDomain: "aile-6bc26.firebaseapp.com",
            databaseURL: "https://aile-6bc26-default-rtdb.firebaseio.com",
            projectId: "aile-6bc26",
            storageBucket: "aile-6bc26.firebasestorage.app",
            messagingSenderId: "983078672524",
            appId: "1:983078672524:web:85a05ff194f3fcde7343a9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function speak(text, callback) {
            if ("speechSynthesis" in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = "tr-TR"; u.rate = 0.9; u.pitch = 1.1;
                if (callback) u.onend = callback;
                window.speechSynthesis.speak(u);
            } else { if (callback) callback(); }
        }

        // --- SES VE TİTREŞİM MOTORU ---
        let audioCtx = null;
        function enableSound() {
            if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            document.getElementById('enable-sound-btn').style.display = 'none';
            playRingtone(); // Test zili
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            statusText.innerText = "Sesler hazır!";
        }

        let ringtoneInterval;
        function playRingtone() {
            if (!audioCtx || audioCtx.state === 'suspended') return;
            try {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.setValueAtTime(480, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } catch(e) {}
        }
        
        function startRinging() {
            playRingtone();
            ringtoneInterval = setInterval(playRingtone, 1000);
            if (navigator.vibrate) navigator.vibrate([1000, 500, 1000, 500, 1000, 500, 1000]); 
        }
        function stopRinging() {
            clearInterval(ringtoneInterval);
            if (navigator.vibrate) navigator.vibrate(0);
        }

        // --- WebRTC Değişkenleri ---
        let localStream = null;
        let peerConnection = null;
        let callTimeout = null;
        const servers = { iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] };

        const callBtn = document.getElementById('call-btn');
        const answerButtons = document.getElementById('answer-buttons');
        const statusText = document.getElementById('status-text');
        const videoScreen = document.getElementById('video-screen');
        const localVideo = document.getElementById('local-video');
        const remoteVideo = document.getElementById('remote-video');

        // Herkesin kendine ait bir odası var
        const myId = window.location.search.includes('receiver=true') ? 'baba' : 'zeynep';
        const otherId = myId === 'baba' ? 'zeynep' : 'baba';

        const myDocRef = ref(db, 'arama/' + myId);
        const otherDocRef = ref(db, 'arama/' + otherId);
        const offerCandidates = ref(db, 'arama/' + myId + '/offerCandidates');
        const answerCandidates = ref(db, 'arama/' + myId + '/answerCandidates');

        async function startCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                return true;
            } catch (e) {
                speak("Kamera veya mikrofon izni verilmedi.");
                alert("Kamera veya mikrofon izni verilmedi!");
                return false;
            }
        }

        // --- ARAMA BAŞLATAN (Her iki taraf da yapabilir) ---
        window.startCall = async function() {
            statusText.innerText = "Kamera açılıyor...";
            speak("Aranıyor, lütfen bekle.");
            
            const ready = await startCamera();
            if (!ready) return;

            statusText.innerText = "Aranıyor...";
            callBtn.disabled = true;
            callBtn.style.opacity = "0.5";

            peerConnection = new RTCPeerConnection(servers);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                remoteVideo.srcObject = event.streams[0];
                videoScreen.style.display = 'flex';
                if(callTimeout) clearTimeout(callTimeout);
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    set(ref(db, 'arama/' + otherId + '/answerCandidates/' + Date.now()), event.candidate.toJSON());
                }
            };

            const offerDescription = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offerDescription);
            
            // Karşı tarafın odasına teklif bırak
            await set(otherDocRef, { offer: { sdp: offerDescription.sdp, type: offerDescription.type }, caller: myId });

            callTimeout = setTimeout(() => {
                if (peerConnection && !peerConnection.currentRemoteDescription) {
                    speak("Telefon açılmadı. Daha sonra tekrar dene.");
                    statusText.innerText = "Açılmadı, iptal edildi.";
                    endCall();
                }
            }, 15000);

            // Karşı tarafın cevabını dinle
            onValue(otherDocRef, (snapshot) => {
                const data = snapshot.val();
                if (data && data.rejected) {
                    speak("Arama reddedildi.");
                    statusText.innerText = "Reddedildi.";
                    endCall();
                } else if (data && data.answer && peerConnection && !peerConnection.currentRemoteDescription) {
                    peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                    statusText.innerText = "Bağlantı kuruldu!";
                    if(callTimeout) clearTimeout(callTimeout);
                }
            });

            // Karşı tarafın ICE adaylarını dinle
            onValue(ref(db, 'arama/' + otherId + '/offerCandidates'), (snapshot) => {
                snapshot.forEach((childSnapshot) => {
                    peerConnection.addIceCandidate(new RTCIceCandidate(childSnapshot.val()));
                });
            });
        };

        // --- ARAMAYI YANITLAYAN ---
        window.answerCall = async function() {
            stopRinging();
            statusText.innerText = "Kamera açılıyor...";
            if(callTimeout) clearTimeout(callTimeout);
            
            const ready = await startCamera();
            if (!ready) return;

            statusText.innerText = "Bağlanıyor...";
            answerButtons.style.display = 'none';
            speak("Arama açıldı.");

            peerConnection = new RTCPeerConnection(servers);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                remoteVideo.srcObject = event.streams[0];
                videoScreen.style.display = 'flex';
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    set(ref(db, 'arama/' + otherId + '/offerCandidates/' + Date.now()), event.candidate.toJSON());
                }
            };

            // Kendi odama gelen teklifi al ve cevapla
            onValue(myDocRef, async (snapshot) => {
                const data = snapshot.val();
                if (data && data.offer && !peerConnection.currentRemoteDescription && !data.answer) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                    const answerDescription = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answerDescription);
                    
                    // Cevabı kendi odama yaz ki karşı taraf okusun
                    await set(myDocRef, { ...data, answer: { type: answerDescription.type, sdp: answerDescription.sdp } });
                    
                    onValue(ref(db, 'arama/' + otherId + '/answerCandidates'), (snap) => {
                        snap.forEach((childSnapshot) => {
                            peerConnection.addIceCandidate(new RTCIceCandidate(childSnapshot.val()));
                        });
                    });
                }
            });
        };

        window.rejectCall = async function() {
            stopRinging();
            statusText.innerText = "Reddedildi.";
            answerButtons.style.display = 'none';
            await set(myDocRef, { rejected: true }); 
            setTimeout(() => {
                remove(myDocRef);
                statusText.innerText = "Hazır";
            }, 2000);
        };

        window.endCall = async function() {
            stopRinging();
            if(callTimeout) clearTimeout(callTimeout);
            if ("speechSynthesis" in window) window.speechSynthesis.cancel();

            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; }
            
            videoScreen.style.display = 'none';
            document.getElementById('main-menu').style.display = 'flex';
            
            await remove(myDocRef);
            
            callBtn.disabled = false;
            callBtn.style.opacity = "1";
            statusText.innerText = "Hazır";
            answerButtons.style.display = 'none';
            callBtn.style.display = 'flex';
        };

        // --- GELEN ARAMALARI DİNLE (Herkes dinler) ---
        document.getElementById('enable-sound-btn').style.display = 'block';
        
        onValue(myDocRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.offer && !data.answer && !data.rejected) {
                statusText.innerText = myId === 'baba' ? "Zeynep arıyor!" : "Baban arıyor!";
                answerButtons.style.display = 'flex';
                
                if (!window.isRinging) {
                    window.isRinging = true;
                    startRinging();
                    speak(myId === 'baba' ? "Zeynep seni arıyor." : "Baban seni arıyor.");
                }
            } else {
                answerButtons.style.display = 'none';
                if (window.isRinging) {
                    stopRinging();
                    window.isRinging = false;
                    statusText.innerText = "Hazır";
                }
            }
        });
    </script>
</body>
</html>
